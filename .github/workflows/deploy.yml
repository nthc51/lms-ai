name: Deploy

# Chỉ deploy khi workflow CI chạy xong và xanh cho một lần push lên main
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false  # không hủy giữa chừng một lần deploy đang chạy

jobs:
  deploy:
    # Chỉ chạy khi đã bật biến repo DEPLOY_ENABLED=true (Settings → Secrets and variables → Actions → Variables),
    # tức là đã có VPS và đủ secret VPS_HOST, VPS_USER, VPS_SSH_KEY cùng biến APP_DOMAIN. Chưa bật thì job
    # được bỏ qua (xám), không báo đỏ mỗi lần push.
    if: >-
      vars.DEPLOY_ENABLED == 'true'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy qua SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 20m
          script: /opt/lms-ai/infra/deploy/deploy.sh ${{ github.event.workflow_run.head_sha }}

      - name: Kiểm tra từ Internet
        run: curl -fsS --retry 10 --retry-delay 3 --retry-all-errors "https://${{ vars.APP_DOMAIN }}/api/v1/ready"
