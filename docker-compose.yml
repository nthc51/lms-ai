services:
  # Mọi cổng publish chỉ bind loopback (127.0.0.1 + [::1]; thiếu [::1] thì "localhost" trên Windows
  # thử IPv6 trước và mất ~2 s mỗi kết nối). Redis chưa có mật khẩu — bổ sung khi deploy (S2).
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms
      POSTGRES_DB: lms
    ports: ["127.0.0.1:5432:5432", "[::1]:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379", "[::1]:6379:6379"]
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001", "[::1]:9000:9000", "[::1]:9001:9001"]
    volumes:
      - miniodata:/data
  api:
    build: ./backend
    env_file: ./backend/.env
    environment: &backend_env
      DATABASE_URL: postgresql+asyncpg://lms:lms@db:5432/lms
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: localhost:9000  # host ký URL phải đúng host trình duyệt/smoke script gọi tới
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["127.0.0.1:8000:8000", "[::1]:8000:8000"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
  worker:
    build: ./backend
    env_file: ./backend/.env
    environment: *backend_env
    command: arq app.worker.settings.WorkerSettings
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
volumes:
  pgdata:
  miniodata:
